# Settings for pnpm, the package manager.

# Write exact version numbers into package.json (3.1.8, not ^3.1.8), so every install is the same.
saveExact: true

# Packages allowed to run a script when they are installed. pnpm runs none unless it is named
# here, and stops if an unnamed package asks. esbuild's script only checks that its program for
# this computer arrived.
allowBuilds:
  esbuild: true
